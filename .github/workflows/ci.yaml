name: CI

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+-?**'
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install tools
        run: |
          make tools
          echo "${PWD}/target/tools/bin" >> "${GITHUB_PATH}"
      - name: Sync wit
        run: make wit
      - name: Check for drift in generated wit
        run: git diff --exit-code .
      - name: Check crate version matches the interface version
        # the crates inherit the workspace version, bumped with the interface by
        # scripts/bump-version.sh
        run: |
          interface_version=$( sed -n "s/^package ${GITHUB_REPOSITORY/\//:}@\(.*\);$/\1/p" wit/worlds.wit )
          workspace_version=$( sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml )
          if [ "${workspace_version}" != "${interface_version}" ] ; then
            echo "::error::the workspace version ${workspace_version} in Cargo.toml does not match the interface version ${interface_version}, see scripts/bump-version.sh"
            exit 1
          fi
      - name: Check crates can be published
        # the release workflow publishes the crates when a release is published, too late to find a
        # crate can't be published. The cli is verified against the library being published with it.
        run: cargo publish --dry-run --locked -p componentized-constants -p componentized-constants-cli
      - name: Build components
        run: make components
      - name: Collect components.tar
        run: tar -cvf ../../components.tar .
        working-directory: ./target/components
      - name: Upload components.tar
        uses: actions/upload-artifact@v7
        with:
          name: components.tar
          path: components.tar
          retention-days: 7
      - name: Test
        run: make test
      - name: Capture WIT
        working-directory: ./target/components
        run: |
          dump_wit() {
            echo "::group::$(basename "$1") ($(du -h "$1" | awk '{print $1}' ))"
              wasm-tools component wit "$1"
            echo "::endgroup::"
          }

          # print interface.wasm first
          if [ -f interface.wasm ] ; then
            dump_wit interface.wasm
          fi
          for component in $(find . -name '*.wasm' -not -name '*.debug.wasm' -not -name 'interface.wasm' | sort) ; do
            dump_wit "${component}"
          done

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    # each runner builds for its own platform
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build cli
        run: cargo build --release --locked --bin constants
      - name: Package cli
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czvf "dist/constants-${{ matrix.target }}.tar.gz" -C target/release constants -C "${PWD}" LICENSE NOTICE README.md
      - name: Package cli
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path target/release/constants.exe, LICENSE, NOTICE, README.md -DestinationPath "dist/constants-${{ matrix.target }}.zip"
      # the smoke test runs the cli from the package, as a user would
      - name: Unpack cli
        if: runner.os != 'Windows'
        run: |
          mkdir -p smoke
          tar -xzvf "dist/constants-${{ matrix.target }}.tar.gz" -C smoke
      - name: Unpack cli
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "dist/constants-${{ matrix.target }}.zip" -DestinationPath smoke
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Smoke test cli
        shell: bash
        run: |
          cat > smoke/smoke.wit <<'EOF'
          package smoke:test;

          world smoke {
              /// @value 42
              export answer: func() -> u32;
          }
          EOF
          ./smoke/constants --wit smoke/smoke.wit -o smoke/smoke.wasm
          actual=$(wasmtime run --invoke 'answer()' smoke/smoke.wasm | tr -d '\r')
          echo "answer() = ${actual}"
          if [ "${actual}" != "42" ] ; then
            echo "::error::expected answer() to return 42, got '${actual}'"
            exit 1
          fi
      - name: Upload cli
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && ( startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' )
    needs:
      - build
      - cli
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install tools
        run: |
          make tools
          echo "${PWD}/target/tools/bin" >> "${GITHUB_PATH}"
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Download components.tar
        uses: actions/download-artifact@v8
        with:
          name: components.tar
      - name: Extract components
        run: mkdir -p target/components && tar -xvf components.tar -C target/components
      - name: Download cli
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Get interface version
        id: interface_version
        run: echo "VERSION=$( wasm-tools component wit target/components/interface.wasm --json | jq -r "[.packages[] | select(.name | contains(\"${GITHUB_REPOSITORY/\//:}@\"))][0].name" | cut -d'@' -f2 )" >> $GITHUB_OUTPUT
      - name: Get tag version
        if: startsWith(github.ref, 'refs/tags/')
        id: tag_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
      - name: Check tag matches the workspace version
        # cargo binstall finds the cli archives at the release tagged with the cli crate's version,
        # and publishing the release publishes both crates to crates.io at that version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          workspace_version=$( sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml )
          if [ "v${workspace_version}" != "${{ steps.tag_version.outputs.VERSION }}" ] ; then
            echo "::error::tag ${{ steps.tag_version.outputs.VERSION }} does not match the workspace version ${workspace_version} in Cargo.toml"
            exit 1
          fi
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish components to gchr.io
        # only publish tags and pre-releases from main
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(steps.interface_version.outputs.VERSION, '-'))
        run: make publish
        env:
          PUBLISH_LOG: "${{ runner.temp }}/published.txt"
          REPOSITORY: "ghcr.io/${{ github.repository }}"
          VERSION: "${{ case(github.ref == 'refs/heads/main', steps.interface_version.outputs.VERSION, steps.tag_version.outputs.VERSION) }}"
      - name: Draft release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "## Published components"
            echo
            echo "| File | Image |"
            echo "| --- | --- |"
            while read -r file image ; do
              echo "| \`${file}\` | \`${image}\` |"
            done < "${RUNNER_TEMP}/published.txt"
          } > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"
      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            components.tar
            dist/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
